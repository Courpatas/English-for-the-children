<title>Word Rider</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Concept: a surf-session game board. Deep lagoon navy ground, coral action colour, one tropical hue per theme. */
:root{
  --bg:#061826; --bg2:#0a2236; --surface:#0e2c43; --surface2:#143a57; --line:#215675;
  --text:#eaf6ff; --muted:#8fb3c9; --coral:#ff6a4d; --coral-d:#e2492d; --lagoon:#19d3c5; --sun:#ffd23f;
  --good:#35e08f; --good-bg:#0d3a2c; --bad:#ff5a79; --bad-bg:#3d1626;
  --display:'Lilita One','Impact','Arial Black',sans-serif; --body:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(25,211,197,.16),transparent 60%),radial-gradient(700px 480px at -10% 8%,rgba(255,106,77,.13),transparent 60%);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 56px}
.tabular{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:30px;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:10px}
.brand b{color:var(--coral);font-weight:400}
.brand svg{width:38px;height:24px;flex:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--text)}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--lagoon);color:#032b2a;border-color:var(--lagoon)}

/* rank */
.rank{margin-top:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rank .lvl{font-family:var(--display);font-size:22px;line-height:1.1}
.rank .sub{color:var(--muted);font-size:13px}
.bar{height:12px;border-radius:99px;background:#0a2438;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lagoon),var(--sun));transition:width .5s ease}
.xp{font-family:var(--display);font-size:22px;color:var(--sun);text-align:right}
.xp small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}

/* hero start */
.hero{margin-top:16px;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.start{position:relative;overflow:hidden;text-align:left;background:linear-gradient(135deg,var(--coral),#ff9a4d);color:#2b0c05;border-radius:18px;padding:20px 22px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 8px 0 var(--coral-d)}
.start:hover{transform:translateY(2px);box-shadow:0 6px 0 var(--coral-d)}
.start:active{transform:translateY(6px);box-shadow:0 2px 0 var(--coral-d)}
.start h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;margin:0}
.start p{margin:0;font-weight:600;max-width:34ch}
.start .go{align-self:flex-start;font-family:var(--display);background:#2b0c05;color:#ffd9c9;padding:7px 16px;border-radius:99px;font-size:17px}
.start svg.wave{position:absolute;right:-10px;bottom:-6px;width:55%;opacity:.28}
.side{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel h3{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;background:#0a2438;border:1px solid var(--line);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--sun);color:#3a2a00;border-color:var(--sun)}
.weak{width:100%;padding:11px 12px;border-radius:12px;background:#0a2438;border:1px dashed var(--lagoon);font-weight:700;color:var(--lagoon)}
.weak:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.weak:not(:disabled):hover{background:#0c2e45}

h2.sec{font-family:var(--display);font-weight:400;font-size:24px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.theme{--c:var(--lagoon);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .12s,border-color .12s}
.theme:hover{transform:translateY(-3px);border-color:var(--c)}
.theme .tag{font-family:var(--display);font-size:22px;letter-spacing:1px;color:#07131d;background:var(--c);align-self:flex-start;padding:4px 11px;border-radius:9px;line-height:1.1}
.theme .nm{font-weight:700;font-size:17px;line-height:1.2}
.theme .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.theme .meta .rv{color:var(--bad)}
.mini{height:8px;border-radius:99px;background:#0a2438;overflow:hidden}
.mini>i{display:block;height:100%;background:var(--c);border-radius:99px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.back{padding:9px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.back:hover{background:var(--surface2)}
.qmeta{flex:1;min-width:0}
.qmeta .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmeta .st{color:var(--muted);font-size:13px}
.badge{font-family:var(--display);padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:18px}
.badge.fire{color:var(--sun)}
.badge.xpg{color:var(--lagoon)}
.track{position:relative;margin-top:14px;height:16px;border-radius:99px;background:#0a2438;border:1px solid var(--line)}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--lagoon),#7af0e4);transition:width .45s ease}
.track .rider{position:absolute;top:-9px;width:34px;height:34px;transform:translateX(-50%);transition:left .45s ease}
.qcard{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 22px 24px}
.qtag{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:8px;background:var(--lagoon);color:#032b2a}
.qprompt{font-size:22px;line-height:1.35;margin:14px 0 4px;font-weight:600;text-wrap:balance}
.qsub{color:var(--muted);margin:0 0 4px}
.en{font-family:var(--display);color:var(--sun);font-size:1.18em;letter-spacing:.3px;font-weight:400}
.fr{color:var(--lagoon);font-weight:700}
.sent{font-size:23px;line-height:1.4;margin:14px 0 4px;font-weight:500}
.sent .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--sun);text-align:center;color:var(--sun);font-family:var(--display);padding:0 6px}
.clue{display:inline-block;margin-top:6px;background:#0a2438;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:15px}
.clue b{color:var(--lagoon)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px;border-radius:14px;background:var(--surface2);border:2px solid var(--line);font-weight:600;font-size:17px;min-height:58px;min-width:0;overflow-wrap:anywhere}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:#0a2438;display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:700}
.opt:not(:disabled):hover{border-color:var(--lagoon);transform:translateY(-1px)}
.opt.sel{border-color:var(--sun)}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.good .k{background:var(--good);color:#04281b}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .k{background:var(--bad);color:#2a0612}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-family:var(--display);font-size:24px;font-weight:400;min-height:70px}
.ans{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.ans input{flex:1;min-width:180px;font:inherit;font-size:20px;font-weight:600;padding:13px 15px;border-radius:14px;border:2px solid var(--line);background:#0a2438;color:var(--text)}
.ans input:focus{border-color:var(--sun);outline:none}
.ans input.good{border-color:var(--good);background:var(--good-bg)}
.ans input.bad{border-color:var(--bad);background:var(--bad-bg)}
.btn{padding:13px 22px;border-radius:14px;background:var(--coral);color:#2b0c05;font-family:var(--display);font-size:19px;box-shadow:0 4px 0 var(--coral-d)}
.btn:hover{transform:translateY(1px);box-shadow:0 3px 0 var(--coral-d)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:0 4px 0 #0a2438;border:1px solid var(--line)}
.hintrow{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.hint{padding:6px 12px;border-radius:9px;background:#0a2438;border:1px solid var(--line);font-weight:600;font-size:14px}
.hintshow{font-family:var(--display);letter-spacing:3px;color:var(--sun);font-size:20px}
.play{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--lagoon);color:#032b2a;font-weight:700}
.play svg{width:22px;height:22px}
.play.slow{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.sbtn{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:inline-grid;place-items:center;vertical-align:middle;margin-left:8px}
.sbtn svg{width:19px;height:19px}
.sbtn:hover{border-color:var(--lagoon)}

/* scramble */
.slots,.pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.slot{width:44px;height:52px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:26px;text-transform:lowercase}
.slot.f{border-style:solid;border-color:var(--sun);background:#0a2438;color:var(--sun);cursor:pointer}
.slot.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.slot.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.tile{width:46px;height:54px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font-family:var(--display);font-size:26px;text-transform:lowercase;box-shadow:0 4px 0 #0a2438}
.tile:not(:disabled):hover{border-color:var(--lagoon)}
.tile:disabled{opacity:.25;box-shadow:none}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:16px}
.mcol{display:flex;flex-direction:column;gap:9px;min-width:0}
.mi{padding:12px 12px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font-weight:600;text-align:left;min-height:48px;overflow-wrap:anywhere}
.mi.en{font-family:var(--body);color:var(--text);font-size:17px}
.mi.sel{border-color:var(--sun);background:#2a2a12}
.mi.done{border-color:var(--good);background:var(--good-bg);opacity:.85}
.mi.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* feedback */
.fb{margin-top:18px;border-radius:16px;padding:16px 18px;border:2px solid;animation:rise .25s ease}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.ko{background:var(--bad-bg);border-color:var(--bad)}
.fb h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.fb.ok h4{color:var(--good)} .fb.ko h4{color:var(--bad)}
.fb p{margin:5px 0;font-size:16px}
.fb .full{font-size:19px;font-weight:600}
.fb .tip{color:var(--muted);font-size:14px}
.fb .row{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.diff i{font-style:normal;color:var(--bad);text-decoration:underline;font-weight:700}
.diff b{color:var(--good)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.xpfloat{position:fixed;left:50%;top:22%;font-family:var(--display);font-size:34px;color:var(--sun);pointer-events:none;animation:floatup 1s ease forwards;z-index:30}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}

/* results */
.res{margin-top:22px;text-align:center}
.res .big{font-family:var(--display);font-size:72px;line-height:1;color:var(--sun)}
.res .big small{font-size:32px;color:var(--muted)}
.res h2{font-family:var(--display);font-weight:400;font-size:30px;margin:6px 0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 18px;min-width:120px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.rev{margin:18px auto 0;max-width:620px;text-align:left}
.rev .it{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-top:8px}
.rev .it span:first-child{font-weight:700}
.ctas{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* save sheet */
.sheet{max-width:640px;margin:22px auto 0}
.sheet textarea{width:100%;min-height:120px;border-radius:12px;border:2px solid var(--line);background:#0a2438;color:var(--text);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:12px}
.note{color:var(--muted);font-size:14px}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .qprompt{font-size:20px}.sent{font-size:20px}
  .rank{grid-template-columns:1fr auto}.rank .barwrap{grid-column:1/-1;order:3}
  .brand{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
var D=/*DATA*/null;
var CX=/*CX*/null;

/* ---------- helpers ---------- */
var LS='wordrider.v1';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function strip(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'');}
function norm(s){return strip(String(s).toLowerCase()).replace(/[^a-z0-9]/g,'');}
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mainOf(e,k){var m=e.replace(/\s*\([^)]*\)/g,'').split(' / ')[0].trim();if(k==='verb')m=m.replace(/^to /,'');return m;}
function varsOf(e,k){
  var out=[];var base=e.replace(/\s*\([^)]*\)/g,'');
  base.split(' / ').forEach(function(x){x=x.trim();out.push(x);if(/^to /.test(x))out.push(x.slice(3));else if(k==='verb')out.push('to '+x);});
  var m=e.match(/\(([^)]*)\)/);if(m)out.push(m[1]);
  return out.map(norm).filter(Boolean);
}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];}for(j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function diffHtml(user,right){
  var u=user.trim(),r=right,out='',L=Math.max(u.length,r.length);
  for(var i=0;i<L;i++){var a=u[i]||'',b=r[i]||'';
    if(a&&a.toLowerCase()===b.toLowerCase())out+='<b>'+esc(a)+'</b>';else if(a)out+='<i>'+esc(a)+'</i>';else out+='<i>_</i>';}
  return out;
}

/* ---------- data ---------- */
var ALL=[],BYSEC={},SECS={},ALLU=[],BYF={},SEEN={};
D.secs.forEach(function(s){
  SECS[s.id]=s;BYSEC[s.id]=[];
  s.items.forEach(function(it,i){
    var o={id:s.id+'|'+i,sec:s.id,e:it.e,f:it.f,k:it.k||'',p:it.p||null};
    o.key=o.e+'|'+o.f;
    o.main=mainOf(o.e,o.k);
    o.vars=varsOf(o.e,o.k);
    o.canType=o.e.indexOf('…')<0&&o.main.length<=22;
    BYSEC[s.id].push(o);ALL.push(o);
    if(!SEEN[o.key]){SEEN[o.key]=1;ALLU.push(o);}
    (BYF[o.f]=BYF[o.f]||[]).push(o);
  });
});
var TTS=(typeof speechSynthesis!=='undefined')&&(typeof SpeechSynthesisUtterance!=='undefined');

/* ---------- contexts (sentences) ---------- */
var P={
 noun:{d:["Let's talk about the ___.","Can you tell me about the ___?","Everybody knows the ___.","I often think about the ___.","Look at the ___!"],
  v2:["My ___ hurts a little.","The doctor looks at my ___.","Be careful with your ___!"],
  v3:["In Tahiti, I like to look at the ___.","A fisherman in Moorea tells me about the ___.","On the beach, we talk about the ___."],
  v4:["At Teahupo'o, the coach explains the ___.","Before the session, my friend asks me about the ___.","A pro surfer talks about the ___."],
  v5:["At home, we use the ___ every day.","Mum asks me to clean the ___.","Where is the ___? It is in the house."],
  v6:["The coach talks about the ___.","At the stadium, everybody looks at the ___.","After the match, we talk about the ___."],
  v9:["I often talk with my ___.","Do you know my ___?","Yesterday I met my ___."],
  v10:["For lunch, I would like the ___.","In the kitchen, I can see the ___.","Can I have the ___, please?"],
  v11:["In class, the teacher talks about the ___.","I need the ___ for school.","Please, give me the ___."],
  v12:["I put on my ___ every morning.","Where is my ___? I can't find it.","My mum washes my ___."],
  v15:["In nature, I can see the ___.","We learn about the ___ in science.","On the island, we talk about the ___."],
  v16:["In town, you can see the ___.","Excuse me, where is the ___?","I am looking for the ___."],
  v17:["I use the ___ every day.","My brother talks about the ___ all the time.","Do you have the ___?"]},
 gen:{d:["Let's talk about the ___.","Can you tell me about the ___?","Everybody knows the ___.","I often think about the ___."]},
 verb:{d:["I know how to ___.","Do you know how to ___?","Today, I really want to ___.","Let's ___ together!","My teacher says: “Please, ___!”"]},
 adj:{d:["That looks ___.","My friend says it is ___.","I think it is ___.","Is it ___ or not?"]},
 human:{d:["My cousin is very ___.","My teacher is quite ___.","He is ___, I think.","Is your brother ___?"]},
 color:{d:["My favourite colour is ___.","She is wearing a ___ T-shirt.","I love this ___ bike!"]},
 day:{d:["Today is ___.","See you on ___!","My favourite day of the week is ___."]},
 month:{d:["My birthday is in ___.","In ___, we go on holiday.","I was born in ___."]},
 season:{d:["My favourite season is ___.","I love ___!"]},
 number:{d:["My lucky number is ___.","Please write the number ___.","How many fingers am I holding up? ___!"]},
 sportname:{d:["My favourite sport is ___.","I really like ___.","Do you want to try ___ with me?"]},
 emotion:{d:["I feel ___ today.","My friend looks ___.","After the match, I am ___."]},
 hungry:{d:["I am very ___.","After the training, we are ___."]},
 taste:{d:["This food is ___.","The soup is really ___.","This mango is ___."]},
 wadj:{d:["Today it is ___ in Papeete.","It is ___ outside."]},
 subject:{d:["My favourite subject is ___.","We have ___ on Monday.","I am good at ___."]}
};
function sentencesFor(o){
  var c=CX[o.sec+':'+o.e];if(c)return [c];
  var pool=P[o.k];if(!pool)return [];
  return pool.d.concat(pool[o.sec]||[]);
}
function fillWord(o){return o.main;}
function sentHtml(s,word,mode){
  var parts=s.split('___');
  var mid=mode==='blank'?'<span class="blank">&nbsp;&nbsp;&nbsp;</span>':'<span class="en">'+esc(word)+'</span>';
  return esc(parts[0])+mid+esc(parts.slice(1).join('___'));
}

function distract(o,n,field,sameKind){
  var sec=BYSEC[o.sec];

  var out=[],seen={};seen[norm(labelOf(o,field))]=1;
  for(var p=0;p<pools.length&&out.length<n;p++){
    var arr=shuffle(pools[p].slice());
    for(var i=0;i<arr.length&&out.length<n;i++){
      var x=arr[i];if(x.f===o.f||x.main===o.main)continue;
      var l=labelOf(x,field),nl=norm(l);if(!nl||seen[nl])continue;
      if(field==='f'&&o.vars.some(function(v){return x.vars.indexOf(v)>=0;}))continue;

}

  if(opts.length<2)return null;
  shuffle(opts);

  q.correct=opts.findIndex(function(x){return x.o===o;});
  q.evaluate=function(i){
    var pk=q.opts[i],ok=(pk.o===o);
    return cfg.fb(ok,pk.o,o);
  };
  return q;
}
function inputQ(o,cfg){
  var main=cfg.answer||o.main;
  var q={type:cfg.type,tag:cfg.tag,mode:'input',o:o,prompt:cfg.prompt,sub:cfg.sub||'',pre:cfg.pre||'',audio:cfg.audio||null,ctx:cfg.ctx||null,hintText:main,answer:main};

function qChain(o){

  var line=function(x){return x.e+' – '+x.p[0]+' – '+x.p[1];};
  var opts=[{t:line(o),o:o}];var seen={};seen[line(o)]=1;
  var guard=0;
  while(opts.length<4&&guard++<60){
    var a=pick(irr),b=pick(irr),c=pick(irr);var v=Math.random();var t;
    if(v<.4)t=o.e+' – '+a.p[0]+' – '+b.p[1];
    else if(v<.7)t=o.e+' – '+o.p[1]+' – '+o.p[0];
    else t=o.e+' – '+o.e+'ed – '+o.e+'ed';
    if(!seen[t]){seen[t]=1;opts.push({t:t,o:null});}
  }

  q.correct=opts.findIndex(function(x){return x.o===o;});

    l.push('<p class="full"><span class="en">'+esc(line(o))+'</span></p>');
    if(!ok)l.push('<p>Ta série, <span class="en">'+esc(q.opts[i].t)+'</span>, n\'est pas la bonne pour ce verbe. Les verbes irréguliers s\'apprennent en bloc.</p>');

function weight(o){var s=SAVE.stats[o.key];if(!s)return 3;var x=(s.w+1)/(s.c+1)+0.25;if(Date.now()-s.t<600000)x*=0.3;return x*2;}
function pickWords(pool,n,excl){
  var arr=pool.filter(function(o){return !(excl&&excl[o.key]);});var chosen=[];
  while(chosen.length<n&&arr.length){
    var tot=0,i;for(i=0;i<arr.length;i++)tot+=weight(arr[i]);
    var r=Math.random()*tot;for(i=0;i<arr.length;i++){r-=weight(arr[i]);if(r<=0)break;}
    if(i>=arr.length)i=arr.length-1;chosen.push(arr.splice(i,1)[0]);
    // keep entries with the same French meaning out of one session
    var f=chosen[chosen.length-1].f;arr=arr.filter(function(x){return x.f!==f;});
  }
  return chosen;
}
function eligible(o){
  var t=[['enfr',3],['fren',3],['tf',1.4]];
  if(o.canType)t.push(['type',2.2]);
  if(sentencesFor(o).length){t.push(['gap',4.5]);if(o.canType)t.push(['gaptype',1.8]);}
  if(o.canType&&/^[A-Za-z']{3,12}$/.test(o.main.replace(/^to /,'')))t.push(['scramble',1.5]);
  if(TTS){t.push(['listenfr',1.1]);if(o.canType)t.push(['listentype',1.1]);}
  if(o.p){t.push(['past',3],['pp',3],['chain',2]);}
  return t;
}

  past:function(o){return formQ(o,'past');},pp:function(o){return formQ(o,'pp');},chain:qChain};
function makeQuestion(o,lastType){
  var st=SAVE.stats[o.key]||{};

  for(var guard=0;guard<10;guard++){
    var tot=el.reduce(function(a,x){return a+x[1];},0),r=Math.random()*tot,ty=el[0][0];
    for(var i=0;i<el.length;i++){r-=el[i][1];if(r<=0){ty=el[i][0];break;}}
    var q=BUILD[ty](o);if(q)return q;
    el=el.filter(function(x){return x[0]!==ty;});if(!el.length)break;

   '<div class="tools"><button class="chip" aria-pressed="'+(SAVE.set.snd?'true':'false')+'" data-act="snd">Sons</button><button class="chip" data-act="save">Ma progression</button></div></div>'+
   '<div class="rank"><div><div class="lvl">'+esc(r.name)+'</div><div class="sub">'+(r.next?'Prochain rang : '+esc(r.next)+' à '+r.hi+' XP':'Rang maximum atteint')+'</div></div>'+
   '<div class="xp tabular">'+SAVE.xp+' XP<small>'+allM+' / '+ALLU.length+' mots acquis</small></div><div class="barwrap" style="grid-column:1/-1"><div class="bar"><i style="width:'+r.pct+'%"></i></div></div></div>'+
   '<div class="hero"><button class="start" data-act="start" data-scope="all"><div><h2>Tous les mots</h2><p>Un mélange de tous les thèmes. Les mots que tu rates reviennent plus souvent.</p></div><span class="go">Lancer la session</span>'+
   '<svg class="wave" viewBox="0 0 200 80" aria-hidden="true"><path d="M0 50c25 0 25-30 50-30s25 30 50 30 25-30 50-30 25 30 50 30v30H0z" fill="#2b0c05"/></svg></button>'+
   '<div class="side"><div class="panel"><h3>Questions par session</h3><div class="seg">'+[10,20,30].map(function(n){return '<button data-act="n" data-n="'+n+'" aria-pressed="'+(SAVE.set.n===n?'true':'false')+'">'+n+'</button>';}).join('')+'</div></div>'+
   '<button class="weak" data-act="start" data-scope="weak" '+(wp<4?'disabled':'')+'>'+(wp<4?'Mes points faibles (pas encore assez d\'erreurs)':'Réviser mes '+wp+' points faibles')+'</button></div></div>'+
   '<h2 class="sec">Par thème</h2><div class="grid">'+cards+'</div>';
}
function showHome(){SES=null;Q=null;render(homeHtml());window.scrollTo(0,0);}

function startSession(scope){
  var pool=scope==='all'?ALLU:scope==='weak'?weakPool():BYSEC[scope];
  if(!pool||pool.length<4)return;
  var n=Math.min(SAVE.set.n,pool.length);
  var slots=[];
  var nMatch=(n>=10&&pool.length>=12)?Math.floor(n/8):0;
  var nWords=n-nMatch;
  var words=pickWords(pool,nWords);
  var used={};words.forEach(function(o){used[o.key]=1;});
  var matches=[];
  for(var m=0;m<nMatch;m++){var mw=pickWords(pool,5,used);if(mw.length<5)break;mw.forEach(function(o){used[o.key]=1;});matches.push(mw);}
  var items=words.map(function(o){return {w:o};});
  matches.forEach(function(mw,i){var pos=Math.min(items.length,(i+1)*8-1);items.splice(pos,0,{m:mw});});
  SES={scope:scope,name:scope==='all'?'Tous les mots':scope==='weak'?'Mes points faibles':SECS[scope].name,color:scope==='all'||scope==='weak'?'#ff6a4d':SECS[scope].color,
    items:items,i:0,score:0,xp:0,streak:0,best:0,wrong:[],lastType:'',done:0};
  nextQ();
}
function nextQ(){
  if(SES.i>=SES.items.length){return finish();}
  var it=SES.items[SES.i];
  Q=it.m?qMatch(it.m):makeQuestion(it.w,SES.lastType);
  ANS=null;Q.hinted=false;Q.sel=[];
  drawQ();
}
function topHtml(){
  var pct=SES.done/SES.items.length*100;
  return '<div class="qtop"><button class="back" data-act="home">Quitter</button><div class="qmeta"><div class="nm">'+esc(SES.name)+'</div><div class="st tabular">Question '+(Math.min(SES.i+1,SES.items.length))+' sur '+SES.items.length+'</div></div>'+
  '<span class="badge fire tabular" title="Série de bonnes réponses">x'+SES.streak+'</span><span class="badge xpg tabular">+'+SES.xp+' XP</span></div>'+
  '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="'+SES.items.length+'" aria-valuenow="'+SES.done+'"><i style="width:'+pct+'%"></i>'+
  '<svg class="rider" style="left:'+Math.max(2,pct)+'%" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#ffd23f"/><path d="M6 20c4 0 4-6 8-6s4 6 8 6 4-6 8-6" fill="none" stroke="#061826" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="17" cy="25" rx="9" ry="2.4" fill="#ff6a4d"/></svg></div>';
}
var ICON_PLAY=ICON_SP;
function drawQ(){
  var h=topHtml();
  h+='<div class="qcard"><span class="qtag">'+esc(Q.tag)+'</span>';
  if(Q.pre)h+=Q.pre;
  if(Q.prompt)h+='<p class="qprompt">'+Q.prompt+'</p>';
  if(Q.sub)h+='<p class="qsub">'+esc(Q.sub)+'</p>';
  if(Q.audio&&TTS&&(Q.type==='listenfr'||Q.type==='listentype'))h+='<div class="hintrow"><button class="play" data-act="say" data-slow="0">'+ICON_SP+'Écouter</button><button class="play slow" data-act="say" data-slow="1">'+ICON_SP+'Lent</button></div>';
  else if(Q.audio&&TTS)h+='<div class="hintrow"><button class="play slow" data-act="say" data-slow="0">'+ICON_SP+'Écouter</button></div>';
  if(Q.mode==='choice'){
    h+='<div class="opts" id="opts">'+Q.opts.map(function(o,i){return '<button class="opt" data-act="pick" data-i="'+i+'"><span class="k">'+(i+1)+'</span><span>'+esc(o.t)+'</span></button>';}).join('')+'</div>';
  }else if(Q.mode==='tf'){
    h+='<div class="opts tf" id="opts">'+Q.opts.map(function(o,i){return '<button class="opt" data-act="pick" data-i="'+i+'">'+o.t+'</button>';}).join('')+'</div>';
  }else if(Q.mode==='input'){
    h+='<div class="ans"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Ta réponse" placeholder="Ta réponse en anglais"><button class="btn" data-act="submit">Valider</button></div>'+
       '<div class="hintrow"><button class="hint" data-act="hint">Indice (-3 XP)</button><span class="hintshow" id="hintshow"></span></div>';
  }else if(Q.mode==='scramble'){
    h+='<div class="slots" id="slots"></div><div class="pool" id="pool"></div><div class="ans"><button class="btn" data-act="submit" id="sbtn" disabled>Valider</button><button class="btn ghost" data-act="reshuffle">Tout effacer</button></div>'+
       '<div class="hintrow"><button class="hint" data-act="hint">Indice (-3 XP)</button><span class="hintshow" id="hintshow"></span></div>';
  }else if(Q.mode==='match'){
    h+='<div class="mgrid"><div class="mcol" id="mL">'+Q.left.map(function(x){return '<button class="mi en" data-act="ml" data-i="'+x.i+'">'+esc(x.o.main)+'</button>';}).join('')+'</div>'+
       '<div class="mcol" id="mR">'+Q.right.map(function(x){return '<button class="mi" data-act="mr" data-i="'+x.i+'">'+esc(x.o.f)+'</button>';}).join('')+'</div></div>';
    Q.errs=0;Q.errW={};Q.pairs=0;Q.cur=null;
  }
  h+='<div id="fb"></div></div>';
  render(h);
  if(Q.mode==='scramble')drawScramble();
  var inp=document.getElementById('ans');if(inp)inp.focus({preventScroll:true});
  if(Q.autoplay&&Q.audio)setTimeout(function(){speak(Q.audio,false);},250);
}
function drawScramble(){
  var L=Q.letters,placed=Q.sel;
  var sl='';for(var i=0;i<Q.answer.length;i++){var idx=placed[i];sl+='<button class="slot'+(idx!==undefined?' f':'')+'" data-act="unplace" data-pos="'+i+'" aria-label="'+(idx!==undefined?'Retirer '+L[idx]:'Case vide')+'">'+(idx!==undefined?esc(L[idx]):'')+'</button>';}
  document.getElementById('slots').innerHTML=sl;
  document.getElementById('pool').innerHTML=L.map(function(c,i){return '<button class="tile" data-act="place" data-i="'+i+'" '+(placed.indexOf(i)>=0?'disabled':'')+'>'+esc(c)+'</button>';}).join('');
  var b=document.getElementById('sbtn');if(b)b.disabled=placed.length!==Q.answer.length;
}
function wordFromScramble(){return Q.sel.map(function(i){return Q.letters[i];}).join('');}

function say(slow){if(Q&&Q.audio)speak(Q.audio,slow);}
function finishAnswer(res,userVal){
  ANS={res:res};
  var o=Q.o;
  if(Q.type!=='match'){
    var st=stat(o);if(res.ok)st.c++;else st.w++;st.t=Date.now();st.lt=Q.type;if(Q.ctx!==undefined&&Q.ctx!==null)st.lc=Q.ctx;
  }
  var gain=0;
  if(res.ok){SES.score++;SES.streak++;SES.best=Math.max(SES.best,SES.streak);gain=10+Math.min(5,Math.floor(SES.streak/3));
    if(Q.mode==='input'||Q.mode==='scramble')gain+=4;if(Q.hinted)gain-=3;}
  else{SES.streak=0;if(Q.type!=='match')SES.wrong.push(o);}
  if(Q.type==='match'){Q.words.forEach(function(w){var st=stat(w);if(Q.errW[w.id])st.w++;else st.c++;st.t=Date.now();st.lt='match';if(Q.errW[w.id])SES.wrong.push(w);});
    gain=Math.max(0,res.ok?(Q.errs===0?30:20):6);}
  gain=Math.max(res.ok?5:0,gain);
  SES.xp+=gain;SAVE.xp+=gain;SES.lastType=Q.type;SES.done++;SES.i++;
  save();beep(res.ok);
  var fb=document.getElementById('fb');
  var last=SES.i>=SES.items.length;
  var streakMsg=res.ok&&SES.streak>=3&&SES.streak%3===0?'<p class="tip">Série de '+SES.streak+' bonnes réponses.</p>':'';
  fb.innerHTML='<div class="fb '+(res.ok?'ok':'ko')+'" role="status" aria-live="polite"><h4>'+esc(res.head)+(gain?' <span style="color:var(--sun)">+'+gain+' XP</span>':'')+'</h4>'+res.html+streakMsg+
    '<div class="row"><button class="btn" data-act="next" id="nextbtn">'+(last?'Voir mon score':'Continuer')+'</button>'+(TTS&&o&&Q.type!=='match'?'<button class="sbtn" data-act="sayfb" aria-label="Écouter le mot">'+ICON_SP+'</button>':'')+'</div></div>';
  var nb=document.getElementById('nextbtn');if(nb)nb.focus({preventScroll:true});
  floatXp(gain);
  refreshTop();
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function refreshTop(){
  var pct=SES.done/SES.items.length*100;
  var b=document.querySelectorAll('.badge');if(b[0])b[0].textContent='x'+SES.streak;if(b[1])b[1].textContent='+'+SES.xp+' XP';
  var t=document.querySelector('.track>i');if(t)t.style.width=pct+'%';
  var r=document.querySelector('.rider');if(r)r.style.left=Math.max(2,pct)+'%';
}
function floatXp(g){if(!g)return;var d=document.createElement('div');d.className='xpfloat';d.textContent='+'+g;document.body.appendChild(d);setTimeout(function(){d.remove();},1000);}

function disableAll(){var all=document.querySelectorAll('#opts .opt');for(var i=0;i<all.length;i++)all[i].disabled=true;}
function onPick(i){
  if(ANS)return;disableAll();
  var res=Q.evaluate(i);
  var btns=document.querySelectorAll('#opts .opt');
  if(Q.mode==='tf'){btns[Q.correct].classList.add('good');if(!res.ok)btns[i].classList.add('bad');}
  else{btns[Q.correct].classList.add('good');if(!res.ok)btns[i].classList.add('bad');}
  finishAnswer(res);
}
function onSubmit(){
  if(ANS)return;
  var val;
  if(Q.mode==='input'){var inp=document.getElementById('ans');val=inp.value;if(!val.trim()){inp.focus();return;}
    var res=Q.evaluate(val);inp.disabled=true;inp.classList.add(res.ok?'good':'bad');
    var sb=document.querySelector('[data-act="submit"]');if(sb)sb.disabled=true;var hb=document.querySelector('[data-act="hint"]');if(hb)hb.disabled=true;
    finishAnswer(res,val);
  }else if(Q.mode==='scramble'){
    val=wordFromScramble();if(val.length!==Q.answer.length)return;var res2=Q.evaluate(val);
    var sl=document.querySelectorAll('.slot');for(var i=0;i<sl.length;i++){sl[i].classList.add(res2.ok?'good':'bad');sl[i].disabled=true;}
    document.querySelectorAll('.tile').forEach(function(t){t.disabled=true;});
    document.querySelectorAll('[data-act="submit"],[data-act="reshuffle"],[data-act="hint"]').forEach(function(b){b.disabled=true;});
    finishAnswer(res2,val);
  }
}
function onHint(){
  if(ANS||Q.hinted)return;Q.hinted=true;
  var t=Q.hintText||Q.answer||'';var s=t.charAt(0)+' '+t.slice(1).replace(/[^ ]/g,'_').split('').join(' ');
  var el=document.getElementById('hintshow');if(el)el.textContent=s.replace(/_ _/g,'_ _');
  var hb=document.querySelector('[data-act="hint"]');if(hb)hb.disabled=true;
}
function onMatch(side,i){
  if(ANS)return;
  var L=document.querySelectorAll('#mL .mi'),R=document.querySelectorAll('#mR .mi');
  function btn(list,idx){for(var k=0;k<list.length;k++)if(+list[k].getAttribute('data-i')===idx)return list[k];}
  if(side==='l'){if(Q.cur!==null){var pb=btn(L,Q.cur);if(pb)pb.classList.remove('sel');}Q.cur=i;btn(L,i).classList.add('sel');return;}
  if(Q.cur===null){return;}
  var lb=btn(L,Q.cur),rb=btn(R,i);if(lb.classList.contains('done')||rb.classList.contains('done'))return;
  if(Q.cur===i){lb.classList.remove('sel');lb.classList.add('done');rb.classList.add('done');lb.disabled=true;rb.disabled=true;Q.pairs++;Q.cur=null;beep(true);
    if(Q.pairs===Q.words.length){var res=Q.evaluate(Q.errs,Q.errW);finishAnswer(res);}
  }else{Q.errs++;var wrongW=Q.words[Q.cur];Q.errW[wrongW.id]=1;lb.classList.add('shake');rb.classList.add('shake');beep(false);
    var cur=Q.cur;setTimeout(function(){lb.classList.remove('shake');rb.classList.remove('shake');},380);
    lb.classList.remove('sel');Q.cur=null;}
}

function finish(){
  SAVE.sessions=(SAVE.sessions||0)+1;
  var n=SES.items.length,pct=Math.round(SES.score/n*100);
  var key=SES.scope;var prev=SAVE.best[key]||0;var newBest=pct>prev;if(newBest)SAVE.best[key]=pct;
  var bonus=pct===100?50:pct>=80?20:0;SAVE.xp+=bonus;SES.xp+=bonus;save();
  var r=rankOf(SAVE.xp);
  var uniq={},wr=[];SES.wrong.forEach(function(o){if(!uniq[o.key]){uniq[o.key]=1;wr.push(o);}});
  var msg=pct===100?'Session parfaite':pct>=80?'Très solide':pct>=60?'Bon début, ça se travaille':'On y retourne, les mots reviendront';
  var h='<div class="top"><div class="brand">Word <b>Rider</b></div></div><div class="res"><div class="big tabular">'+SES.score+'<small> / '+n+'</small></div><h2>'+msg+'</h2>'+
   '<div class="stats"><div class="stat"><b class="tabular">'+pct+'&nbsp;%</b><span>de réussite</span></div><div class="stat"><b class="tabular">+'+SES.xp+'</b><span>XP gagnés'+(bonus?' (dont '+bonus+' de bonus)':'')+'</span></div><div class="stat"><b class="tabular">x'+SES.best+'</b><span>meilleure série</span></div><div class="stat"><b>'+esc(r.name)+'</b><span>rang actuel</span></div></div>'+
   (newBest&&prev>0?'<p class="note">Nouveau record sur ce thème (ancien : '+prev+'&nbsp;%).</p>':'');
  if(wr.length){h+='<div class="rev"><h3 style="font-family:var(--display);font-weight:400;font-size:22px;margin:10px 0 0">À retenir</h3>'+wr.map(function(o){return '<div class="it"><span class="en">'+esc(o.e)+'</span><span class="fr">'+esc(o.f)+'</span></div>';}).join('')+'</div>';}
  else h+='<p class="note">Aucun mot raté. Les mêmes mots reviendront dans d\'autres phrases et d\'autres formats.</p>';
  h+='<div class="ctas"><button class="btn" data-act="replay">Rejouer ce thème</button><button class="btn ghost" data-act="home">Accueil</button></div></div>';
  render(h);window.scrollTo(0,0);
  if(pct>=80)confetti();
}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#ff6a4d','#ffd23f','#19d3c5','#3d9bff','#b07cff','#35e08f'];
  for(var i=0;i<46;i++){var d=document.createElement('i');d.className='confetti';d.style.left=rnd(100)+'vw';d.style.background=pick(cols);d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(d);(function(x){setTimeout(function(){x.remove();},3800);})(d);}
}

function showSave(){
  var code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))));}catch(e){}
  render('<div class="top"><div class="brand">Word <b>Rider</b></div><button class="back" data-act="home">Retour</button></div><div class="sheet"><h2 class="sec" style="margin-top:10px">Ma progression</h2>'+
   '<p class="note">Ta progression est gardée dans ce navigateur. Pour la garder ailleurs, copie ce code et colle-le sur un autre appareil.</p>'+
   '<textarea id="code" readonly aria-label="Code de sauvegarde">'+esc(code)+'</textarea><div class="ctas" style="justify-content:flex-start"><button class="btn ghost" data-act="copy">Copier le code</button></div>'+
   '<h2 class="sec" style="font-size:20px">Restaurer</h2><textarea id="restore" placeholder="Colle ici un code de sauvegarde" aria-label="Code à restaurer"></textarea>'+
   '<div class="ctas" style="justify-content:flex-start"><button class="btn" data-act="restore">Restaurer</button></div><p class="note" id="smsg"></p>'+
   '<h2 class="sec" style="font-size:20px">Tout remettre à zéro</h2><div class="ctas" style="justify-content:flex-start"><button class="btn ghost" data-act="reset1" id="rst">Effacer ma progression</button></div></div>');
}

/* ---------- events ---------- */
function onClick(e){
  var t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  var a=t.getAttribute('data-act');
  if(a==='start')return startSession(t.getAttribute('data-scope'));
  if(a==='home'){return showHome();}
  if(a==='n'){SAVE.set.n=+t.getAttribute('data-n');save();return showHome();}
  if(a==='snd'){SAVE.set.snd=!SAVE.set.snd;save();return showHome();}
  if(a==='save')return showSave();
  if(a==='pick')return onPick(+t.getAttribute('data-i'));
  if(a==='submit')return onSubmit();
  if(a==='hint')return onHint();
  if(a==='next'){return nextQ();}
  if(a==='replay'){return startSession(SES.scope);}
  if(a==='say')return say(t.getAttribute('data-slow')==='1');
  if(a==='sayfb'){if(Q&&Q.o)speak(Q.o.main,false);return;}
  if(a==='ml')return onMatch('l',+t.getAttribute('data-i'));
  if(a==='mr')return onMatch('r',+t.getAttribute('data-i'));
  if(a==='place'){if(ANS)return;var i=+t.getAttribute('data-i');if(Q.sel.length<Q.answer.length&&Q.sel.indexOf(i)<0){Q.sel.push(i);drawScramble();}return;}
  if(a==='unplace'){if(ANS)return;var p=+t.getAttribute('data-pos');if(p<Q.sel.length){Q.sel.splice(p,1);drawScramble();}return;}
  if(a==='reshuffle'){if(ANS)return;Q.sel=[];drawScramble();return;}
  if(a==='copy'){var c=document.getElementById('code');c.select();try{navigator.clipboard.writeText(c.value).then(function(){document.getElementById('smsg').textContent='Code copié.';},function(){document.getElementById('smsg').textContent='Copie le code à la main (il est sélectionné).';});}catch(x){document.getElementById('smsg').textContent='Copie le code à la main (il est sélectionné).';}return;}
  if(a==='restore'){var v=document.getElementById('restore').value.trim();try{var o=JSON.parse(decodeURIComponent(escape(atob(v))));if(o&&typeof o==='object'&&o.stats){for(var k in o)SAVE[k]=o[k];save();document.getElementById('smsg').textContent='Progression restaurée.';}else throw 0;}catch(x){document.getElementById('smsg').textContent='Ce code n\'est pas valide.';}return;}
  if(a==='reset1'){t.textContent='Confirmer : tout effacer';t.setAttribute('data-act','reset2');return;}
  if(a==='reset2'){SAVE={xp:0,stats:{},set:SAVE.set,best:{},sessions:0};save();return showHome();}
}
function onKey(e){
  if(!SES||!Q)return;
  var tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(e.key==='Enter'){
    if(ANS){e.preventDefault();nextQ();return;}
    if(Q.mode==='input'||Q.mode==='scramble'){e.preventDefault();onSubmit();}
    return;
  }
  if(ANS||tag==='INPUT'||tag==='TEXTAREA')return;
  if((Q.mode==='choice'||Q.mode==='tf')&&/^[1-4]$/.test(e.key)){var i=+e.key-1;if(Q.opts[i])onPick(i);}
  if(Q.mode==='scramble'){
    if(e.key==='Backspace'){Q.sel.pop();drawScramble();return;}
    if(/^[a-zA-Z']$/.test(e.key)){var c=e.key.toLowerCase();for(var j=0;j<Q.letters.length;j++){if(Q.letters[j].toLowerCase()===c&&Q.sel.indexOf(j)<0&&Q.sel.length<Q.answer.length){Q.sel.push(j);drawScramble();break;}}}
  }
}

/* ---------- boot / test hooks ---------- */
var api={ALL:ALL,ALLU:ALLU,BYSEC:BYSEC,sentencesFor:sentencesFor,makeQuestion:makeQuestion,eligible:eligible,BUILD:BUILD,qMatch:qMatch,norm:norm,SAVE:SAVE,acceptFor:acceptFor};
if(typeof window!=='undefined')window.WR=api;else if(typeof globalThis!=='undefined')globalThis.WR=api;
if(typeof document!=='undefined'&&document.getElementById){
  app=document.getElementById('app');load();
  app.addEventListener('click',onClick);document.addEventListener('keydown',onKey);
  showHome();
}
})();
</script>
